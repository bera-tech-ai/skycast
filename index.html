<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyCast - Weather Forecast</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            background-attachment: fixed;
            color: #ffffff;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .app-wrapper {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 0 16px;
        }

        /* --- Glassmorphism Card --- */
        .glass {
            background: rgba(20, 20, 30, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            padding: 24px 28px;
        }

        .glass-card {
            background: rgba(20, 20, 30, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            padding: 20px 24px;
            transition: transform 0.2s ease;
        }

        /* --- Header --- */
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 32px;
        }

        .header .logo {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #a8c0ff, #d4bfff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .search-area {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: nowrap;
            width: 100%;
            max-width: 480px;
        }

        .search-area input {
            flex: 1;
            min-width: 180px;
            padding: 14px 20px;
            border: none;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border 0.3s;
        }

        .search-area input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .search-area input:focus {
            border-color: rgba(255, 255, 255, 0.3);
        }

        .btn-search {
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 12px 20px;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            font-size: 1.1rem;
        }

        .btn-search:hover {
            background: rgba(255, 255, 255, 0.20);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .btn-search svg {
            width: 20px;
            height: 20px;
            fill: #fff;
        }

        /* --- Toggle Unit --- */
        .unit-toggle-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-unit {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 40px;
            padding: 10px 22px;
            color: #fff;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s;
            letter-spacing: 0.5px;
        }

        .btn-unit:hover {
            background: rgba(255, 255, 255, 0.20);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .btn-unit .unit-label {
            font-size: 1.1rem;
        }

        /* --- Loading Spinner --- */
        .spinner-overlay {
            display: none;
            justify-content: center;
            align-items: center;
            padding: 30px 0;
        }

        .spinner-overlay.active {
            display: flex;
        }

        .spinner {
            width: 52px;
            height: 52px;
            border: 5px solid rgba(255, 255, 255, 0.05);
            border-top-color: #a0c4ff;
            border-right-color: #d4bfff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            backdrop-filter: blur(2px);
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* --- Error Message --- */
        .error-msg {
            display: none;
            background: rgba(220, 60, 60, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 80, 80, 0.25);
            border-radius: 16px;
            padding: 16px 24px;
            color: #ffb3b3;
            font-size: 1rem;
            margin: 12px 0 20px 0;
            box-shadow: 0 4px 20px rgba(220, 30, 30, 0.15);
        }

        .error-msg.visible {
            display: block;
        }

        /* --- Current Weather Card --- */
        .current-weather {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px 28px;
            align-items: center;
        }

        .current-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .city-name {
            font-size: 2.2rem;
            font-weight: 600;
            margin-bottom: 4px;
            line-height: 1.2;
        }

        .current-temp {
            font-size: 4.2rem;
            font-weight: 300;
            line-height: 1;
            letter-spacing: -1px;
        }

        .current-temp .temp-unit-symbol {
            font-size:2rem; font-weight: 400; vertical-align: top; opacity: 0.85; margin-left: 2px; } .condition-text { font-size: 1.15rem; color: rgba(255, 255, 255, 0.85); text-transform: capitalize; margin-top: 6px; } .current-right { display: flex; flex-direction: column; align-items: flex-end; gap: 14px; } .weather-icon-wrap { display: flex; align-items: center; justify-content: center; width: 100px; height: 100px; border-radius: 50%; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.1); } .weather-icon-wrap img { width: 84px; height: 84px; object-fit: contain; } .metrics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; } .metric-box { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; } .metric-label { font-size: 0.8rem; color: rgba(255, 255, 255, 0.65); text-transform: uppercase; letter-spacing: 0.5px; } .metric-value { font-size: 1.15rem; font-weight: 600; color: #ffffff; } .section-card { padding: 24px 28px; } .section-title { font-size: 1.15rem; font-weight: 600; margin-bottom: 16px; color: #ffffff; letter-spacing: 0.2px; } .hourly-scroll { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, 0.25) transparent; } .hourly-scroll::-webkit-scrollbar { height: 6px; } .hourly-scroll::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.04); border-radius: 999px; } .hourly-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.22); border-radius: 999px; } .hourly-item { flex: 0 0 auto; min-width: 92px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 14px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; transition: transform 0.2s ease, background 0.2s ease; } .hourly-item:hover { transform: translateY(-3px); background: rgba(255, 255, 255, 0.1); } .hourly-time { font-size: 0.85rem; color: rgba(255, 255, 255, 0.75); font-weight: 500; } .hourly-icon { width: 44px; height: 44px; object-fit: contain; } .hourly-temp { font-size: 1rem; font-weight: 600; color: #ffffff; } .hourly-condition { font-size: 0.75rem; color: rgba(255, 255, 255, 0.65); text-align: center; text-transform: capitalize; } .daily-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; } .daily-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 16px 10px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; transition: transform 0.2s ease, background 0.2s ease; } .daily-card:hover { transform: translateY(-3px); background: rgba(255, 255, 255, 0.1); } .daily-day { font-size: 0.92rem; font-weight: 600; color: #ffffff; } .daily-date { font-size: 0.75rem; color: rgba(255, 255, 255, 0.6); } .daily-icon { width: 48px; height: 48px; object-fit: contain; } .daily-temps { display: flex; flex-direction: column; gap: 2px; font-size: 0.9rem; } .daily-high { font-weight: 600; color: #ffffff; } .daily-low { font-size: 0.82rem; color: rgba(255, 255, 255, 0.65); } .daily-condition { font-size: 0.75rem; color: rgba(255, 255, 255, 0.72); text-transform: capitalize; } @media (max-width: 900px) { .daily-grid { grid-template-columns: repeat(4, 1fr); } } @media (max-width: 768px) { body { padding: 16px 12px 36px; } .header { flex-direction: column; align-items: stretch; padding: 18px; gap: 14px; } .header-top { display: flex; align-items: center; justify-content: space-between; } .header-controls { width: 100%; flex-wrap: wrap; } .search-form { flex: 1 1 200px; } .search-input { width: 100%; min-width: 0; } .current-weather { grid-template-columns: 1fr; padding: 20px; } .current-right { align-items: flex-start; } .metrics-grid { grid-template-columns: 1fr; } .city-name { font-size: 1.75rem; } .current-temp { font-size: 3.4rem; } .daily-grid { grid-template-columns: repeat(2, 1fr); } } </style> </head> <body> <div class="app-container"> <header class="glass-card header"> <h1 class="brand-title">SkyCast</h1> <div class="header-controls"> <form class="search-form" id="searchForm" autocomplete="off"> <input type="text" id="cityInput" class="search-input" placeholder="Search city..." aria-label="Search city..." value="London" /> <button type="submit" class="search-btn" id="searchBtn" aria-label="Search"> <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"> <circle cx="11" cy="11" r="8"></circle> <line x1="21" y1="21" x2="16.65" y2="16.65"></line> </svg> </button> </form> <button type="button" class="unit-toggle" id="unitToggle" aria-label="Toggle temperature unit"> <span id="unitLabel">°C</span> </button> </div> </header> <div id="loadingState" class="glass-card status-panel"> <div class="spinner" aria-hidden="true"></div> <p class="loading-text">Loading...</p> </div> <div id="errorState" class="glass-card error-box" role="alert"></div> <main id="weatherContent" class="weather-content hidden"> <section class="glass-card current-weather" aria-label="Current weather"> <div class="current-left"> <h2 class="city-name" id="cityName">London</h2> <div class="current-temp"> <span id="currentTemp">--</span><span class="temp-unit-symbol" id="currentTempUnit">°C</span> </div> <p class="condition-text" id="conditionText">--</p> </div> <div class="current-right"> <div class="weather-icon-wrap"> <img id="currentIcon" src="" alt="" /> </div> <div class="metrics-grid"> <div class="metric-box"> <span class="metric-label">Feels Like</span> <span class="metric-value" id="feelsLikeValue">--</span> </div> <div class="metric-box"> <span class="metric-label">Humidity</span> <span class="metric-value" id="humidityValue">--</span> </div> <div class="metric-box"> <span class="metric-label">Wind Speed</span> <span class="metric-value" id="windSpeedValue">--</span> </div> </div> </div> </section> <section class="glass-card section-card" aria-label="Hourly forecast"> <h2 class="section-title">Hourly Forecast</h2> <div class="hourly-scroll" id="hourlyContainer"></div> </section> <section class="glass-card section-card" aria-label="7-day forecast"> <h2 class="section-title">7-Day Forecast</h2> <div class="daily-grid" id="dailyContainer"></div> </section> </main> </div> <script> const DEFAULT_CITY = 'London'; const ICON_BASE_URL = 'https://openweathermap.org/img/wn/'; let currentUnit = 'C'; let latestWeatherData = null; const searchForm = document.getElementById('searchForm'); const cityInput = document.getElementById('cityInput'); const unitToggle = document.getElementById('unitToggle'); const unitLabel = document.getElementById('unitLabel'); const currentTempUnit = document.getElementById('currentTempUnit'); const loadingState = document.getElementById('loadingState'); const errorState = document.getElementById('errorState'); const weatherContent = document.getElementById('weatherContent'); const cityNameEl = document.getElementById('cityName'); const currentTempEl = document.getElementById('currentTemp'); const conditionTextEl = document.getElementById('conditionText'); const currentIconEl = document.getElementById('currentIcon'); const feelsLikeValueEl = document.getElementById('feelsLikeValue'); const humidityValueEl = document.getElementById('humidityValue'); const windSpeedValueEl = document.getElementById('windSpeedValue'); const hourlyContainer = document.getElementById('hourlyContainer'); const dailyContainer = document.getElementById('dailyContainer'); function convertTemp(celsiusValue) { if (typeof celsiusValue !== 'number' || Number.isNaN(celsiusValue)) { return '--'; } const converted = currentUnit === 'F' ? (celsiusValue * 9) / 5 + 32 : celsiusValue; return Math.round(converted); } function formatTempWithUnit(celsiusValue) { const val = convertTemp(celsiusValue); if (val === '--') return '--'; return `${val}°${currentUnit}`; } function getIconUrl(iconCode) { const code = iconCode || '01d'; return `${ICON_BASE_URL}${code}@2x.png`; } function showLoading() { loadingState.classList.remove('hidden'); errorState.classList.remove('visible'); errorState.textContent = ''; weatherContent.classList.add('hidden'); } function showError(message) { loadingState.classList.add('hidden'); weatherContent.classList.add('hidden'); errorState.textContent = `Error: ${message}`; errorState.classList.add('visible'); } function showWeather() { loadingState.classList.add('hidden'); errorState.classList.remove('visible'); errorState.textContent = ''; weatherContent.classList.remove('hidden'); } function formatHourLabel(item, index) { if (item && item.time) return item.time; const rawDt = item && (item.dt || item.timestamp || item.date); if (rawDt) { const dateObj = typeof rawDt === 'number' ? new Date(rawDt < 1e12 ? rawDt * 1000 : rawDt) : new Date(rawDt); if (!Number.isNaN(dateObj.getTime())) { return dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); } } const now = new Date(Date.now() + index * 3600 * 1000); return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); } function formatDayLabel(item, index) { if (item && item.day) return item.day; const rawDt = item && (item.dt || item.date || item.timestamp); if (rawDt) { const dateObj = typeof rawDt === 'number' ? new Date(rawDt < 1e12 ? rawDt * 1000 : rawDt) : new Date(rawDt); if (!Number.isNaN(dateObj.getTime())) { return { day: index === 0 ? 'Today' : dateObj.toLocaleDateString([], { weekday: 'short' }), date: dateObj.toLocaleDateString([], { month: 'short', day: 'numeric' }) }; } } const fallbackDate = new Date(Date.now() + index * 86400 * 1000); return { day: index === 0 ? 'Today' : fallbackDate.toLocaleDateString([], { weekday: 'short' }), date: fallbackDate.toLocaleDateString([], { month: 'short', day: 'numeric' }) }; } function normalizeWeatherPayload(data, fallbackCity) { const currentSrc = data.current || data; const mainSrc = currentSrc.main || {}; const weatherArr = Array.isArray(currentSrc.weather) ? currentSrc.weather : []; const primaryWeather = weatherArr[0] || currentSrc.condition || {}; const city = data.city || data.name || currentSrc.city || currentSrc.name || fallbackCity; const tempC = typeof currentSrc.temp === 'number' ? currentSrc.temp : typeof currentSrc.temperature === 'number' ? currentSrc.temperature : typeof mainSrc.temp === 'number' ? mainSrc.temp : null; const feelsLikeC = typeof currentSrc.feels_like === 'number' ? currentSrc.feels_like : typeof currentSrc.feelsLike === 'number' ? currentSrc.feelsLike : typeof mainSrc.feels_like === 'number' ? mainSrc.feels_like : tempC; const humidity = typeof currentSrc.humidity === 'number' ? currentSrc.humidity : typeof mainSrc.humidity === 'number' ? mainSrc.humidity : null; const windSpeed = typeof currentSrc.wind_speed === 'number' ? currentSrc.wind_speed : typeof currentSrc.windSpeed === 'number' ? currentSrc.windSpeed : typeof currentSrc.wind?.speed === 'number' ? currentSrc.wind.speed : null; const condition = typeof currentSrc.condition === 'string' ? currentSrc.condition : primaryWeather.description || primaryWeather.main || 'Clear'; const icon = currentSrc.icon || primaryWeather.icon || '01d'; const rawHourly = Array.isArray(data.hourly) ? data.hourly : Array.isArray(data.list) ? data.list : []; const hourly = rawHourly.slice(0, 24).map((entry) => { const eMain = entry.main || {}; const eWeather = Array.isArray(entry.weather) ? entry.weather[0] || {} : entry.condition || {}; const eTemp = typeof entry.temp === 'number' ? entry.temp : typeof entry.temperature === 'number' ? entry.temperature : typeof eMain.temp === 'number' ? eMain.temp : tempC; return { dt: entry.dt || entry.time || entry.timestamp || entry.date, time: entry.time || null, temp: eTemp, icon: entry.icon || eWeather.icon || icon, condition: typeof entry.condition === 'string' ? entry.condition : eWeather.description || eWeather.main || condition }; }); const rawDaily = Array.isArray(data.daily) ? data.daily : Array.isArray(data.forecast) ? data.forecast : []; const daily = rawDaily.slice(0, 7).map((entry) => { const eTempObj = entry.temp || {}; const eWeather = Array.isArray(entry.weather) ? entry.weather[0] || {} : entry.condition || {}; const high = typeof entry.temp_max === 'number' ? entry.temp_max : typeof entry.high === 'number' ? entry.high : typeof entry.max === 'number' ? entry.max : typeof eTempObj.max === 'number' ? eTempObj.max : tempC; const low = typeof entry.temp_min === 'number' ? entry.temp_min : typeof entry.low === 'number' ? entry.low : typeof entry.min === 'number' ? entry.min : typeof eTempObj.min === 'number' ? eTempObj.min : tempC; return { dt: entry.dt || entry.date || entry.timestamp, day: entry.day || null, date: entry.dateLabel || null, high, low, icon: entry.icon || eWeather.icon || icon, condition: typeof entry.condition === 'string' ? entry.condition : eWeather.description || eWeather.main || condition }; }); return { city, temp: tempC, feelsLike: feelsLikeC, humidity, windSpeed, condition, icon, hourly, daily }; } function renderWeather(normalized) { if (!normalized) return; unitLabel.textContent = currentUnit === 'C' ? '°F' : '°C'; currentTempUnit.textContent = `°${currentUnit}`; cityNameEl.textContent = normalized.city; currentTempEl.textContent = convertTemp(normalized.temp); conditionTextEl.textContent = normalized.condition; const iconUrl = getIconUrl(normalized.icon); currentIconEl.src = iconUrl; currentIconEl.alt = normalized.condition; feelsLikeValueEl.textContent = formatTempWithUnit(normalized.feelsLike); humidityValueEl.textContent = typeof normalized.humidity === 'number' && !Number.isNaN(normalized.humidity) ? `${Math.round(normalized.humidity)}%` : '--'; windSpeedValueEl.textContent = typeof normalized.windSpeed === 'number' && !Number.isNaN(normalized.windSpeed) ? `${normalized.windSpeed} m/s` : '--'; hourlyContainer.innerHTML = ''; normalized.hourly.slice(0, 24).forEach((hourItem, idx) => { const card = document.createElement('div'); card.className = 'hourly-item'; const timeEl = document.createElement('span'); timeEl.className = 'hourly-time'; timeEl.textContent = formatHourLabel(hourItem, idx); const imgEl = document.createElement('img'); imgEl.className = 'hourly-icon'; imgEl.src = getIconUrl(hourItem.icon); imgEl.alt = hourItem.condition || 'Hourly weather'; const tempEl = document.createElement('span'); tempEl.className = 'hourly-temp'; tempEl.textContent = formatTempWithUnit(hourItem.temp); const condEl = document.createElement('span'); condEl.className = 'hourly-condition'; condEl.textContent = hourItem.condition || ''; card.appendChild(timeEl); card.appendChild(imgEl); card.appendChild(tempEl); card.appendChild(condEl); hourlyContainer.appendChild(card); }); dailyContainer.innerHTML = ''; normalized.daily.slice(0, 7).forEach((dayItem, idx) => { const card = document.createElement('div'); card.className = 'daily-card'; const labelInfo = formatDayLabel(dayItem, idx); const dayEl = document.createElement('span'); dayEl.className = 'daily-day'; dayEl.textContent = typeof labelInfo === 'string' ? labelInfo : labelInfo.day; const dateEl = document.createElement('span'); dateEl.className = 'daily-date'; dateEl.textContent = dayItem.date || (typeof labelInfo === 'object' ? labelInfo.date : ''); const imgEl = document.createElement('img'); imgEl.className = 'daily-icon'; imgEl.src = getIconUrl(dayItem.icon); imgEl.alt = dayItem.condition || 'Daily weather'; const tempsEl = document.createElement('div'); tempsEl.className = 'daily-temps'; const highEl = document.createElement('span'); highEl.className = 'daily-high'; highEl.textContent = formatTempWithUnit(dayItem.high); const lowEl = document.createElement('span'); lowEl.className = 'daily-low'; lowEl.textContent = formatTempWithUnit(dayItem.low); tempsEl.appendChild(highEl); tempsEl.appendChild(lowEl); const condEl = document.createElement('span'); condEl.className = 'daily-condition'; condEl.textContent = dayItem.condition || ''; card.appendChild(dayEl); if (dateEl.textContent) { card.appendChild(dateEl); } card.appendChild(imgEl); card.appendChild(tempsEl); card.appendChild(condEl); dailyContainer.appendChild(card); }); showWeather(); } async function fetchWeather(city) { const trimmedCity = (city || '').trim(); if (!trimmedCity) { showError('Please enter a city name.'); return; } showLoading(); try { const response = await fetch(`/api/weather?city=${encodeURIComponent(trimmedCity)}`); let payload = null; try { payload = await response.json(); } catch (_) { payload = null; } if (!response.ok) { const serverMsg = (payload && (payload.error || payload.message)) || `Unable to load weather data (status ${response.status}).`; throw new Error(serverMsg); } if (!payload || typeof payload !== 'object') { throw new Error('Invalid weather response received from server.'); } if (payload.error) { throw new Error(payload.error); } latestWeatherData = normalizeWeatherPayload(payload, trimmedCity); renderWeather(latestWeatherData); } catch (err) { showError(err && err.message ? err.message : 'Failed to fetch weather data.'); } } searchForm.addEventListener('submit', (event) => { event.preventDefault(); fetchWeather(cityInput.value); }); unitToggle.addEventListener('click', () => { currentUnit = currentUnit === 'C' ? 'F' : 'C'; if (latestWeatherData) { renderWeather(latestWeatherData); } else { unitLabel.textContent = currentUnit === 'C' ? '°F' : '°C'; currentTempUnit.textContent = `°${currentUnit}`; } }); window.addEventListener('DOMContentLoaded', () => { fetchWeather(DEFAULT_CITY); }); </script> </body> </html>
